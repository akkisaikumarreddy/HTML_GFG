<html>
    <head>
        <title>HTML Links</title>
        <style>
            body{  
                font-size: 40px;
                text-align: center;
                margin-top: 100px;
                margin-bottom: 100px;
                margin-right: 280px;
                margin-left: 280px;
                background-color: aqua;
                border: 5px;
                border-style: dashed;
                border-color: red blue yellow green;
            }
        </style>
    </head>
    <body>
        <!-- basic link example -->
        <a href="https://www.geeksforgeeks.org/web-development/?ref=dhm">web_development</a><br>

        <!-- ( _blank) attribute will Opens the linked document in a new window or tab. -->
        <a href="https://www.geeksforgeeks.org/web-development/?ref=dhm" target="_blank">web_development_blank</a><br>

        <!--  ( _self) attribute Opens the linked document in the same frame or window as the link. (Default behavior) -->
        <a href="https://www.geeksforgeeks.org/web-development/?ref=dhm" target="_self">web_development_self</a><br>


        <!--  ( _parent) attribute Opens the linked document in the parent frame. -->
        <a href="https://www.geeksforgeeks.org/web-development/?ref=dhm" target="_parent">web_development_parent</a><br>


        <!--  ( _top) attribute  Opens the linked document in the full body of the window. -->
        <a href="https://www.geeksforgeeks.org/web-development/?ref=dhm" target="_top">web_development_top</a><br>


        <!--  framename  Opens the linked document in a specified frame. The frame’s name is specified in the attribute. -->


        <!-- linking an imaage   <a href="image.jpg"><img src="image.jpg" alt="Image"></a>   -->
         <a href="images/india worldcup.jpg"><img src="images/india worldcup.jpg" alt="Image"></a><br>


        <!--Link to an Email Address  <a href="mailto:someone@example.com">Send Email</a>   -->
         <a href="mailto:saikumarreddyakki288@gmail.com">email</a><br>


        <!-- phone number  <a href="tel:+1234567890">Call Now</a>  -->
         <a href="tel:+8297653116">phone_number</a><br>


        <!--  Button  <a href="https://www.example.com"> <button>Visit Example</button> </a>  -->
          <a href="https://www.geeksforgeeks.org/web-development/?ref=dhm"><button>visit</button></a><br>


        <!-- Link to Download File   <a href="file.pdf" download>Download File</a>  -->
         <a href="html_attributes.html" download>download_file</a><br>


        <!-- Link Title	  <a href="https://www.example.com" title="Visit Example">Link Text</a>  -->
         <a href="https://www.google.com/search?gs_ssp=eJzj4tVP1zc0LDFMqzBPKjc0YPRiKygtzihIBABQvQcV&q=pushpa&rlz=1C1CHBD_enIN1086IN1086&oq=pushpa&gs_lcrp=EgZjaHJvbWUqDAgBEC4YJxiABBiKBTIHCAAQABiPAjIMCAEQLhgnGIAEGIoFMg0IAhAuGNQCGLEDGIAEMgwIAxAAGEMYgAQYigUyDwgEEAAYQxixAxiABBiKBTIGCAUQRRg9MgYIBhBFGD0yBggHEEUYPNIBCDM5ODZqMGo3qAIIsAIB8QXXdYA2hYZHcA&sourceid=chrome&ie=UTF-8" title="visit example">link_title</a>

    </body>
</html>
