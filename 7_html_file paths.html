<html>
    <head>
        <title>Html File Paths</title>
    </head>
    
    <body style="text-align: center;">
        <h1>Absolute file paths</h1>
        <!-- resource’s location on the internet and include the full URL,
         which consists of the protocol (http:// or https://), domain, and path to the resource.-->
        <img src="https://c4.wallpaperflare.com/wallpaper/749/648/41/black-and-white-hd-naruto-black-and-white-wallpaper-preview.jpg" alt="Naruto" style="width: 400px; "  /><br>


        <hr>


        <h1>Relative file path</h1>
        <!-- Specify the path to a resource in relation to the location of the HTML file currently being viewed. -->
        <img src="images/Naruto.jpg" alt="Naruto" style="width: 400px;">


    </body>
</html>
