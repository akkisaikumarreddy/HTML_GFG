<html>
    <head>
        <title>HTML Images</title>
    </head>        
    <body>  
        <!-- basic <img> tag example to get image -->
         <img src="images/Luffy.jpg" />  <br>


        <!-- <img> tag using "alt" attribute -->
         <img src="images/Luffy.jpg" alt="Luffy" />  <br>


        <!-- <img> tag using "width" and "height" attribute to set image size -->
         <img src="images/Luffy.jpg" alt="Luffy"  width="600"  height="370" />  <br>

          
        <!-- <img> tag how to add "title" to its image -->       
         <img src="images/Luffy.jpg" alt="Luffy"  title="MONKE Y.D.LUFFY" /><br>       


        <!-- <img> tag  setting style of an image -->
         <img src="images/Luffy.jpg" alt="Luffy"  style="border: 5px double red;" /><br>


         <br>


        <!-- <img> tag  setting image alignment -->
         <img src="images/Luffy.jpg" alt ="Luffy" border="5px"  align="right" />  <br>
         <br>

         <div style="text-align: center;">
            <img src="images/Luffy.jpg" alt="Luffy" style="border: 5px dashed green;" />
         </div>
         <br>
         <br>


        <!-- <img> tag adding image as link -->
         <a href="https://motionbgs.com/monkey-d-luffy-straw-hat">
            <img src="images/Luffy.jpg" alt="Luffy" border="4px">
         </a><br>
         
         <br>


        <!-- <img> tag adding animated image -->
         <img src="gif/ohhhhh.gif" alt="ohhhh"  width="200"  height="200"> <br>



    </body>
</html>
